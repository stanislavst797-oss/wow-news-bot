name: WoW news to Discord

on:
  schedule:
    # Смещённые минуты намеренно: на ровных :00 очередь GitHub перегружена.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Два прогона одновременно подрались бы за push posted.json.
concurrency:
  group: wow-news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Не shallow-клон: нужен для git pull --rebase и для проверки возраста HEAD.
          fetch-depth: 50

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet --upgrade feedparser requests

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python bot.py

      - name: Commit posted.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if git diff --staged --quiet; then
            echo "posted.json не изменился — коммитить нечего"
            exit 0
          fi
          git commit -m "state: обновление posted.json [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push не прошёл (попытка $attempt) — подтягиваю удалённые изменения"
            git pull --rebase --autostash
          done
          git push

      - name: Keepalive
        # GitHub отключает scheduled-воркфлоу после 60 дней без активности в репозитории.
        # Обычно активность даёт коммит posted.json; это страховка на случай мёртвой ленты.
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "последний коммит был $days дн. назад"
          if [ "$days" -ge 30 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: активность репозитория [skip ci]"
            git push
          fi
