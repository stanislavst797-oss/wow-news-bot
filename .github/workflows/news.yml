name: WoW news to Discord

on:
  schedule:
    # 5 минут — минимально допустимый интервал в GitHub Actions.
    # Расписание тут best-effort: часть срабатываний GitHub пропускает,
    # поэтому чем чаще просим, тем меньше реальная задержка.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Два прогона одновременно подрались бы за push posted.json.
concurrency:
  group: wow-news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Не shallow-клон: нужен для git pull --rebase и для проверки возраста HEAD.
          fetch-depth: 50

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: python -m pip install --quiet -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python bot.py

      - name: Commit posted.json
        # always(): если бот упал уже после отправки части новостей, состояние
        # всё равно надо сохранить, иначе следующий прогон отправит их повторно.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if git diff --staged --quiet; then
            echo "posted.json не изменился — коммитить нечего"
            exit 0
          fi
          git commit -m "state: обновление posted.json [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "состояние сохранено"
              exit 0
            fi
            echo "push не прошёл (попытка $attempt) — подтягиваю удалённые изменения"
            if ! git pull --rebase --autostash; then
              # Оставить репозиторий в середине незавершённого rebase нельзя:
              # следующая попытка push молча ушла бы в никуда.
              git rebase --abort || true
              echo "::error::конфликт по posted.json, состояние не сохранено — следующий прогон может повторить одну новость"
              exit 1
            fi
          done
          git push

      - name: Keepalive
        # GitHub отключает scheduled-воркфлоу после 60 дней без активности в репозитории.
        # Обычно активность даёт коммит posted.json; это страховка на случай мёртвой ленты.
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "последний коммит был $days дн. назад"
          if [ "$days" -ge 30 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: активность репозитория [skip ci]"
            git push
          fi
