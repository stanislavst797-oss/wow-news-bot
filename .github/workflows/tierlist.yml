name: Mythic+ tier list to Discord

on:
  schedule:
    # Ежедневно в 06:00 UTC (09:00 МСК). Archon пересчитывает данные несколько раз
    # в сутки («Last updated: N hours ago»), поэтому недельный снимок устаревал бы.
    # Задержка планировщика GitHub тут роли не играет.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Отдельная группа: этот воркфлоу не должен мешать новостному боту.
concurrency:
  group: wow-tierlist-bot
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: python -m pip install --quiet -r requirements-tierlist.txt

      - name: Install Chromium
        # --with-deps ставит системные библиотеки, без которых Chromium
        # на ubuntu-latest не стартует.
        run: python -m playwright install --with-deps chromium

      - name: Run tier list bot
        env:
          # По одному секрету на роль. Имя переменной для каждой роли задано
          # полем webhook_env в tierlist_config.json — добавляя роль, добавьте
          # и строку сюда.
          TIERLIST_WEBHOOK: ${{ secrets.TIERLIST_WEBHOOK }}
          TANK_WEBHOOK: ${{ secrets.TANK_WEBHOOK }}
          HEALER_WEBHOOK: ${{ secrets.HEALER_WEBHOOK }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python tierlist.py

      - name: Upload screenshots
        # always(): именно на упавшем прогоне картинки нужнее всего —
        # видно, что снялось вместо тир-листа и таблицы.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tierlist-screenshots
          path: |
            tierlist-*.png
            rankings-*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Commit tierlist_state.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tierlist_state.json
          if git diff --staged --quiet; then
            echo "tierlist_state.json не изменился — коммитить нечего"
            exit 0
          fi
          git commit -m "state: обновление tierlist_state.json [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "состояние сохранено"
              exit 0
            fi
            echo "push не прошёл (попытка $attempt) — подтягиваю удалённые изменения"
            if ! git pull --rebase --autostash; then
              git rebase --abort || true
              echo "::error::конфликт по tierlist_state.json, состояние не сохранено"
              exit 1
            fi
          done
          git push
